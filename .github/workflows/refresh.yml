name: Refresh data and README

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - scripts/**

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch repos and releases
        env:
          GH_USER: lunanoir21
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_data.py
      - name: Build README and cards
        run: python scripts/build_readme.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md assets/stats-dark.svg assets/stats-light.svg assets/stars-dark.svg assets/stars-light.svg
          git diff --cached --quiet -I'generatedAt' || (git commit -m "chore: refresh data and README" && git push)
